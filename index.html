<style>
@font-face{
  font-family:"RK Serif";
  src:url("fonts/rk-serif.woff2") format("woff2");
  font-weight:400 700;
  font-display:swap;   /* 字体没到之前先用系统字，不留白 */
}

/* ============================================================
   调色板 —— 想换配色只改这里
   ============================================================ */
:root{
  --bg:           #fdfcfa;
  --bg-panel:     #f5f3ef;
  --bg-raise:     #ecebe5;
  --line:         #e3e1da;
  --blood-1:      #b3151c;
  --blood-2:      #5d0a10;
  --blood-edge:   #7d0f15;
  --char:         #fdfcfa;
  --slate:        #8b867c;
  --slate-light:  #4c473e;
  --slate-bright: #17140f;
  --accent:       #17140f;
  --accent-soft:  rgba(23,20,15,.06);
  --paper:        #efe6d8;

  --font-body: "PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-display: "RK Serif","Songti SC","Source Han Serif SC","Noto Serif SC",SimSun,Georgia,serif;
  --font-mono: ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono","Courier New",monospace;
  --ease: cubic-bezier(.4,0,.2,1);

  /* 间距刻度：全站只用这几档 */
  --s1:8px; --s2:16px; --s3:24px; --s4:40px; --s5:64px;
  /* 标题三级 */
  --t1:clamp(26px,3.4vw,34px);
  --t2:20px;
  --t3:17px;
  --measure:36em;          /* 正文阅读宽度 */
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--slate-light);
  font-family:var(--font-body);font-size:16px;line-height:1.85;letter-spacing:.02em;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
::selection{background:var(--accent);color:var(--char)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}

.skip{position:absolute;left:-9999px;top:0;z-index:100;
  background:var(--accent);color:var(--char);padding:12px 20px;font-size:14px;font-weight:600}
.skip:focus{left:16px;top:16px}

/* 桌面质感：极淡的颗粒 */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.03;
  background-image:radial-gradient(rgba(0,0,0,.7) 1px, transparent 1px);
  background-size:3px 3px}

/* ============================================================
   封面页 —— 整屏，不滚动
   ============================================================ */
#gate{position:fixed;inset:0;z-index:200;overflow:hidden;isolation:isolate;
  background:var(--bg)}
#gate.hide{display:none}

/* 背景：台阶远山照片，静止不动，只做极轻微的呼吸 */
.gate-bg-img{position:absolute;inset:0;z-index:-4;
  background-image:url("photos/cover_stairs.jpg");
  background-size:cover;background-position:center;background-repeat:no-repeat;
  background-color:var(--bg)}

/* 只在照片右侧（风景一侧）压一层极淡的白，帮文字区和照片衔接得更干净 */
.gate-veil{position:absolute;inset:0;z-index:-2;pointer-events:none;
  background:linear-gradient(90deg, rgba(253,252,250,.08) 0%, rgba(253,252,250,0) 20%)}

/* 顶栏 */
.gate-top{position:absolute;top:clamp(20px,2.8vh,34px);
  left:clamp(24px,4.2vw,72px);right:clamp(24px,4.2vw,72px);
  display:flex;align-items:flex-start;gap:20px;z-index:2}
.gate-brand{font-family:var(--font-mono);font-size:12px;letter-spacing:.3em;
  color:var(--slate-bright);text-transform:uppercase;white-space:nowrap}
.gate-brand b{color:var(--slate-bright);font-weight:400}
.gate-clock{margin-left:auto;padding-left:11px;
  border-left:2px solid rgba(23,20,15,.2);line-height:1.45}
.gate-clock .lab{display:block;font-family:var(--font-mono);font-size:10.5px;
  letter-spacing:.22em;color:var(--slate);text-transform:uppercase}
.gate-clock .val{display:block;font-family:var(--font-mono);font-size:13px;
  letter-spacing:.06em;color:var(--slate-bright);white-space:nowrap}

/* 主区：贴左，落在照片本身过曝发白的那片区域里 */
.gate-main{position:absolute;z-index:2;inset:0;
  display:flex;align-items:center;justify-content:flex-start;
  padding:clamp(24px,4.2vw,72px)}
.gate-box{max-width:380px;width:100%;text-align:left;
  padding:0;margin-left:clamp(8px,3vw,40px);
  border:none;background:none;box-shadow:none;backdrop-filter:none}
.gate-row{margin-left:0;margin-right:0}
.gate-mark, .gate-tip, .gate-foot{margin-left:0;margin-right:0}

.gate-mark{font-family:var(--font-mono);font-size:11px;letter-spacing:.32em;
  color:var(--slate);margin-bottom:16px;text-transform:uppercase}
.gate-name{font-family:var(--font-display);
  font-size:clamp(44px,8.6vh,84px);font-weight:700;
  line-height:1;letter-spacing:.01em;color:var(--slate-bright);
  /* 照片深浅不一，名字压在暗处也要认得清 */
  text-shadow:0 1px 1px rgba(253,252,250,.5),0 0 24px rgba(253,252,250,.35)}
.gate-tip{font-size:clamp(14px,1.6vh,16px);line-height:1.75;
  color:var(--slate-light);margin:clamp(16px,2.4vh,24px) 0 clamp(24px,3.4vh,36px);
  max-width:26em}

/* 口令输入：极细下划线，不加底色和边框盒子 */
.gate-row{display:flex;align-items:flex-end;gap:16px;max-width:320px}
.gate-row input{flex:1;min-width:0;height:38px;
  padding:0 0 8px;border-radius:0;
  background:none;border:none;border-bottom:1px solid rgba(23,20,15,.3);
  color:var(--slate-bright);font-family:var(--font-mono);font-size:15px;letter-spacing:.2em;
  transition:border-color .2s var(--ease)}
.gate-row input::placeholder{color:var(--slate);letter-spacing:.14em}
.gate-row input:focus{border-color:var(--slate-bright);outline:none}
.gate-row button{flex:none;height:38px;padding:0 20px;
  border-radius:20px;font-size:13.5px;font-weight:600;letter-spacing:.04em;
  background:var(--slate-bright);color:var(--bg);
  transition:opacity .18s var(--ease)}
.gate-row button:hover{opacity:.78}
.gate-err{min-height:20px;margin-top:11px;font-size:13px;
  color:var(--blood-1);font-weight:500;letter-spacing:.02em}
.gate-foot{margin-top:clamp(16px,2.4vh,24px);font-family:var(--font-mono);
  font-size:10.5px;letter-spacing:.14em;color:var(--slate)}

.shake{animation:shk .38s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}
  40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* ---------- 入场：逐个错开，安静一点 ---------- */
@keyframes riseIn{from{opacity:0;transform:translate3d(0,9px,0)}
  to{opacity:1;transform:none}}
@keyframes lineIn{from{transform:translate3d(0,108%,0) skewY(2deg)}
  to{transform:none}}
.gate-name-wrap{overflow:hidden;display:block}
#gate .anim{opacity:0;animation:riseIn .6s cubic-bezier(.16,1,.3,1) forwards}
#gate .gate-brand{animation-delay:.08s}
#gate .gate-clock{animation-delay:.16s}
#gate .gate-mark {animation-delay:.24s}
#gate .gate-name{opacity:1;animation:lineIn .82s cubic-bezier(.22,1,.36,1) .30s both}
#gate .gate-tip  {animation-delay:.62s}
#gate .gate-row  {animation-delay:.80s}
#gate .gate-foot {animation-delay:.96s}

@media (max-width:520px){
  .gate-clock .d{display:none}
  .gate-brand{letter-spacing:.2em;font-size:11px}
}
@media (max-width:820px){
  .gate-name{font-size:clamp(40px,13vw,64px)}
  .gate-row{max-width:none}
  .gate-box{margin-left:0}
}
@media (max-height:520px){
  .gate-tip{margin:10px 0 16px}
}
@media (prefers-reduced-motion:reduce){
  #gate .anim,#gate .gate-name{animation:none;opacity:1}
}



/* ============================================================
   门厅 —— 封面和桌面之间的一层
   ============================================================ */
#hall{position:fixed;inset:0;z-index:150;overflow:hidden;background:var(--bg);display:none;
  --mx:50%;--my:42%}
#hall.on{display:block}

/* 背景地图：暗层打底，亮层用跟随鼠标的圆形遮罩露出来，像手电筒 */
.hall-map{position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:url("photos/hall_map_dim.jpg");
  background-size:cover;background-position:center}
.hall-map.lit{
  background-image:url("photos/hall_map_lit.jpg");
  -webkit-mask-image:radial-gradient(circle 260px at var(--mx) var(--my),
    #000 0%, #000 32%, transparent 74%);
  mask-image:radial-gradient(circle 260px at var(--mx) var(--my),
    #000 0%, #000 32%, transparent 74%)}
/* 触屏没有鼠标位置：不做光斑，整张地图统一给一个安静的亮度 */
@media (hover:none), (pointer:coarse){
  .hall-map.lit{-webkit-mask-image:none;mask-image:none;opacity:.62}
}
@media (prefers-reduced-motion:reduce){
  .hall-map.lit{-webkit-mask-image:none;mask-image:none;opacity:.62}
}

.hall-wrap{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;
  justify-content:space-between;
  padding:clamp(24px,4vh,44px) clamp(24px,4.2vw,72px)}
.hall-top{display:flex;align-items:flex-start;gap:20px}
.hall-mark{font-family:var(--font-mono);font-size:11px;letter-spacing:.3em;
  color:rgba(253,252,250,.92);text-transform:uppercase}
.hall-mark b{color:rgba(253,252,250,.92);font-weight:400}

.hall-mid{max-width:min(620px,60vw)}
.hall-sub{font-size:15px;line-height:1.8;
  color:rgba(253,252,250,.7);max-width:30em}

.hall-bot{display:flex;flex-wrap:wrap;align-items:flex-end;gap:clamp(20px,4vw,64px)}
.ledger-tot{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.14em;
  color:rgba(253,252,250,.55);line-height:2}
.ledger-tot b{color:rgba(253,252,250,.92);font-weight:400;font-size:14px}
.hall-recent{flex:1;min-width:240px;max-width:420px}
.hall-recent .lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.22em;
  color:rgba(253,252,250,.55);text-transform:uppercase;margin-bottom:var(--s1)}
.hall-recent a{display:flex;align-items:baseline;gap:10px;padding:5px 0;
  border-bottom:1px solid rgba(253,252,250,.16);transition:color .2s var(--ease)}
.hall-recent a:hover .ht{color:#fff}
.hall-recent .hd{flex:none;width:10px;height:10px;border-radius:2px;background:rgba(253,252,250,.7)}
.hall-recent .ht{flex:1;min-width:0;font-size:13.5px;color:rgba(253,252,250,.82);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hall-recent .hw{flex:none;font-family:var(--font-mono);font-size:10.5px;
  color:rgba(253,252,250,.5)}

.hall-go{flex:none;padding:13px 26px;border-radius:20px;font-size:14.5px;font-weight:600;
  background:#fdfcfa;color:#17140f;letter-spacing:.04em;
  transition:opacity .2s var(--ease)}
.hall-go:hover{opacity:.82}
.hall-back{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;
  color:rgba(253,252,250,.55);margin-left:auto;transition:color .2s var(--ease)}
.hall-back:hover{color:#fff}

/* 入场：用过渡而不是关键帧，避免在某些时序下卡在起始帧 */
.hall-mark,.hall-sub,.hall-bot{
  opacity:0;transform:translateY(12px);
  transition:opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1)}
#hall.on .hall-mark,#hall.on .hall-sub,#hall.on .hall-bot{
  opacity:1;transform:none}
#hall.on .hall-mark{transition-delay:.10s}
#hall.on .hall-sub {transition-delay:.30s}
#hall.on .hall-bot   {transition-delay:.78s}

@media (max-width:820px){
  .hall-mid{max-width:none}
  .hall-bot{flex-direction:column;align-items:stretch;gap:var(--s3)}
  .hall-recent{max-width:none}
  .hall-go{width:100%;text-align:center}
}
@media (prefers-reduced-motion:reduce){
  .hall-mark,.hall-sub,.hall-bot{opacity:1;transform:none;transition:none}
}

/* 右上角编辑锁 */
#lock{position:fixed;top:14px;right:16px;z-index:60;display:flex;align-items:center;gap:8px;
  padding:6px 13px;border-radius:2px;border:1px solid var(--line);
  background:rgba(253,252,250,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  font-family:var(--font-mono);font-size:11.5px;letter-spacing:.12em;color:var(--slate);
  cursor:pointer;transition:border-color .2s var(--ease),color .2s var(--ease);opacity:.55}
#lock:hover,#lock:focus-visible{opacity:1;border-color:var(--accent);color:var(--accent)}
#lock.on{opacity:1;border-color:var(--accent);color:var(--char);background:var(--accent)}
#lock.hide{display:none}

#pw{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
  padding:24px;background:rgba(23,20,15,.4)}
#pw.on{display:flex}
.pw-box{width:100%;max-width:330px;background:var(--bg-panel);border:1px solid var(--line);
  border-radius:6px;padding:26px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.pw-box h2{font-family:var(--font-display);font-size:18px;font-weight:700;
  letter-spacing:.05em;color:var(--slate-bright);margin-bottom:6px}
.pw-box p{font-size:13.5px;color:var(--slate);margin-bottom:18px}

/* ============================================================
   桌面（首页）—— 分栏卡片
   ============================================================ */
.stage{position:relative;z-index:2;max-width:1120px;margin:0 auto;
  padding:clamp(40px,7vh,84px) clamp(20px,4vw,40px) 90px}

.hud-mark{font-family:var(--font-mono);font-size:11px;letter-spacing:.3em;
  color:var(--accent);text-transform:uppercase}
.hr-d{flex:none;font-family:var(--font-mono);font-size:10.5px;color:var(--slate);opacity:.7}

.bento-head{display:flex;align-items:flex-start;justify-content:space-between;
  gap:24px;margin-bottom:clamp(28px,4vh,44px)}
.bento-head-l{max-width:42em}
.bento-name{font-family:var(--font-display);font-size:clamp(30px,3.6vw,44px);
  font-weight:700;letter-spacing:.02em;color:var(--slate-bright);margin-top:10px;line-height:1.1}
.bento-bio{margin-top:14px;max-width:34em;font-size:14.5px;line-height:1.8;color:var(--slate-light)}
.bento-cta{flex:none;padding:11px 24px;border-radius:22px;border:1px solid var(--line);
  font-family:var(--font-mono);font-size:12.5px;letter-spacing:.12em;color:var(--slate);
  background:var(--bg-panel);transition:color .2s var(--ease),border-color .2s var(--ease)}
.bento-cta:hover{color:var(--slate-bright);border-color:var(--slate-bright)}

.bento-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:stretch}
@media (max-width:980px){.bento-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.bento-grid{grid-template-columns:1fr}}
.bento-col{display:flex;flex-direction:column;gap:16px;min-width:0}

.bento-card{position:relative;display:block;border-radius:18px;overflow:hidden;
  border:1px solid var(--line);background:var(--bg-panel);color:inherit}

.bento-card-lab{display:flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--slate)}
.bento-card-lab.left{justify-content:flex-start}
.bento-card-lab .spk{opacity:.5;font-size:9px}

/* 左列：照片 + 栏目跳转 */
.bento-photo{min-height:420px;display:flex;flex-direction:column;justify-content:space-between;
  padding:20px;color:#fff;
  background-image:linear-gradient(180deg, rgba(10,8,6,.5) 0%, rgba(10,8,6,.08) 20%, rgba(10,8,6,.42) 66%, rgba(10,8,6,.74)),
    url("photos/field_cover.jpg");
  background-size:cover;background-position:center 20%}
.bento-photo .bento-card-lab{color:rgba(255,255,255,.82)}
.bento-jump{display:flex;flex-direction:column}
.bento-jump a{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:9px 4px;border-top:1px solid rgba(255,255,255,.16);
  font-size:14px;color:rgba(255,255,255,.94);transition:opacity .2s var(--ease)}
.bento-jump a:first-child{border-top:none}
.bento-jump a:hover{opacity:.65}
.bento-jump a b{font-family:var(--font-mono);font-weight:400;font-size:11px;
  letter-spacing:.06em;color:rgba(255,255,255,.64)}

/* 中列：研究观察卡（照片封面） */
.glass-tint{background:rgba(253,252,250,.62);backdrop-filter:blur(10px) saturate(120%);
  -webkit-backdrop-filter:blur(10px) saturate(120%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6), inset 0 0 0 1px rgba(23,20,15,.05)}
.bento-field{flex:1;min-height:340px;display:flex;flex-direction:column;justify-content:space-between;
  padding:20px;color:#fff;
  background-image:linear-gradient(180deg, rgba(10,8,6,.55) 0%, rgba(10,8,6,.06) 26%, rgba(10,8,6,.3) 60%, rgba(10,8,6,.8) 100%),
    url("photos/field_card.jpg");
  background-size:cover;background-position:center}
.bento-field .bento-card-lab{color:rgba(255,255,255,.85)}
.bento-field-foot{display:flex;align-items:center;justify-content:space-between}
.bento-field-foot .hr-d{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;
  color:rgba(255,255,255,.88)}
.bento-field .bento-arrow{border-color:rgba(255,255,255,.45);color:#fff}
.bento-field:hover .bento-arrow{border-color:#fff}

/* 右列：方法跑马灯 + 标签索引 */
.bento-marquee{min-height:180px;padding:20px 0;display:flex;flex-direction:column;
  justify-content:center;gap:14px}
.bento-marquee .bento-card-lab{padding:0 20px}
.marquee-track{overflow:hidden;
  -webkit-mask-image:linear-gradient(to right,transparent,black 10%,black 90%,transparent);
  mask-image:linear-gradient(to right,transparent,black 10%,black 90%,transparent)}
.marquee-row{display:flex;gap:8px;width:max-content}
.marquee-row.left{animation:mLeft 24s linear infinite}
.marquee-row.right{animation:mRight 28s linear infinite}
@keyframes mLeft{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes mRight{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.m-pill{flex:none;padding:7px 14px;border-radius:20px;border:1px solid var(--line);
  font-family:var(--font-mono);font-size:11.5px;letter-spacing:.04em;color:var(--slate-light);
  background:var(--bg)}

.bento-tags{flex:1;min-height:140px;padding:20px;display:flex;flex-direction:column;
  justify-content:space-between;gap:14px;transition:background-color .2s var(--ease)}
.bento-tags:hover{background:var(--bg-raise)}
.bento-tag-list{display:flex;flex-wrap:wrap;gap:7px}
.bento-tag-list span{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.04em;
  color:var(--slate);border:1px solid var(--line);padding:3px 10px;border-radius:2px}
.bento-tags-foot{display:flex;align-items:center;justify-content:space-between}
.bento-arrow{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--slate);
  transition:border-color .2s var(--ease),color .2s var(--ease)}
.bento-tags:hover .bento-arrow{border-color:var(--slate-bright);color:var(--slate-bright)}

.bento-hint{margin-top:20px;text-align:right;font-family:var(--font-mono);font-size:10.5px;
  letter-spacing:.14em;color:var(--slate);opacity:.6}

@media (max-width:640px){
  .bento-head{flex-direction:column;gap:16px}
  .bento-photo{min-height:280px}
}
@media (prefers-reduced-motion:reduce){
  .marquee-row.left,.marquee-row.right{animation:none}
}

/* ============================================================
   栏目内页
   ============================================================ */
.sheetview{max-width:820px;animation:openIn .5s var(--ease)}
.prose{max-width:var(--measure)}
@keyframes openIn{
  from{opacity:0;transform:translateY(14px) scale(.985)}
  to{opacity:1;transform:none}
}
/* 内页顶部：栏目之间横向跳转 */
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px;
  margin-bottom:var(--s3);padding-bottom:var(--s2);border-bottom:1px solid var(--line)}
.crumb a{padding:5px 11px;border-radius:3px;font-size:13px;color:var(--slate);
  transition:color .2s var(--ease),background-color .2s var(--ease)}
.crumb a:hover{color:var(--slate-bright);background:var(--bg-panel)}
.crumb a.on{color:var(--c-ink);background:var(--c-mid);font-weight:600}
.crumb .home{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.12em;
  margin-right:var(--s1);padding-left:0}
.crumb .home:hover{background:none;color:var(--accent)}

.back{display:inline-flex;align-items:center;gap:9px;margin-bottom:26px;
  font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;color:var(--slate);
  transition:color .2s var(--ease)}
.back:hover,.back:focus-visible{color:var(--accent)}

.view-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:8px}
.chip{flex:none;width:13px;height:13px;border-radius:3px;margin-top:12px;
  background:var(--c-mid);box-shadow:0 0 0 3px rgba(255,255,255,.05)}
.view-title{font-family:var(--font-display);font-size:var(--t1);
  font-weight:700;letter-spacing:.04em;color:var(--slate-bright);line-height:1.2}
.view-sub{font-size:14.5px;color:var(--slate);margin:2px 0 0 27px}
.rule{height:2px;width:44px;background:var(--c-mid);margin:18px 0 30px 27px}

.prose p{margin-bottom:16px}
.prose p:last-child{margin-bottom:0}
.prose strong{color:var(--slate-bright);font-weight:600}
.prose em{color:var(--slate-light);font-style:italic}
.prose h3{font-family:var(--font-display);font-size:var(--t3);font-weight:700;letter-spacing:.05em;
  color:var(--slate-bright);margin:var(--s4) 0 var(--s2)}
.prose blockquote{border-left:3px solid var(--c-mid);padding:4px 0 4px 20px;margin:24px 0;
  color:var(--slate-bright);font-family:var(--font-display);font-size:17px;line-height:1.8}
.prose ul{margin:0 0 16px}
.prose li{position:relative;padding-left:20px;margin-bottom:6px}
.prose li::before{content:"—";position:absolute;left:0;color:var(--c-mid);
  font-family:var(--font-mono);font-size:13px}

/* 正文里插的图（Markdown 的 ![说明](路径) 语法） */
.md-img{margin:20px 0}
.md-img img{max-width:100%;display:block;border-radius:6px;
  box-shadow:0 0 0 1px rgba(23,20,15,.08)}
.md-img figcaption{margin-top:8px;font-size:12px;letter-spacing:.03em;
  color:var(--slate);font-family:var(--font-mono)}
.link{color:var(--slate-bright);border-bottom:1px solid rgba(23,20,15,.25);
  transition:color .2s var(--ease),border-color .2s var(--ease)}
.link:hover{color:var(--accent);border-color:var(--accent)}

/* 条目卡 */
.cards{margin:0 -16px}
.card{position:relative;display:grid;grid-template-columns:1fr;gap:6px;
  padding:16px;border-radius:5px;
  transition:opacity .25s var(--ease),transform .25s var(--ease)}
.card::before{content:"";position:absolute;inset:0;border-radius:5px;z-index:-1;
  background:var(--bg-panel);box-shadow:inset 0 0 0 1px rgba(23,20,15,.05);
  opacity:0;transition:opacity .25s var(--ease)}
.card>*{position:relative}
.card:hover::before,.card:focus-within::before{opacity:1}
.card:hover,.card:focus-within{transform:translateY(-2px)}
@media (hover:hover){
  .cards:hover .card{opacity:.5}
  .cards .card:hover,.cards .card:focus-within{opacity:1}
}
.card-meta{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.1em;
  color:var(--slate);padding-top:5px;white-space:nowrap}
.card-title{font-size:16px;font-weight:600;color:var(--slate-bright);line-height:1.6}
.card:hover .card-title,.card:focus-within .card-title{color:var(--c-mid)}
.arrow{display:inline-block;font-family:var(--font-mono);transition:transform .2s var(--ease)}
.card:hover .arrow{transform:translate(3px,-3px)}
.card-org{font-size:14px;color:var(--slate-light);margin-top:2px}
.card-desc{font-size:14.5px;margin-top:8px;color:var(--slate)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tag{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;
  color:var(--c-mid);border:1px solid currentColor;padding:2px 10px;border-radius:2px;opacity:.85}
@media (min-width:720px){
  .card{grid-template-columns:118px 1fr;gap:4px 20px}
  .card-meta{grid-row:span 4}
}

/* 文章 */
.article-head{margin-bottom:28px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.article-date{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;
  color:var(--slate);margin-bottom:12px}
.article-title{font-family:var(--font-display);font-size:clamp(24px,3.6vw,32px);
  font-weight:700;line-height:1.45;letter-spacing:.03em;color:var(--slate-bright)}
.article{max-width:var(--measure);font-size:16.5px}
.article-nav{display:flex;justify-content:space-between;gap:16px;margin-top:56px;
  padding-top:24px;border-top:1px solid var(--line);
  font-family:var(--font-mono);font-size:12px;letter-spacing:.08em}
.article-nav a{max-width:46%;transition:color .2s var(--ease)}
.article-nav a:hover{color:var(--c-mid)}
.article-nav .nx{text-align:right;margin-left:auto}

/* 相册 */
.album-group{margin-bottom:48px}
.album-title{font-family:var(--font-display);font-size:var(--t2);font-weight:700;
  letter-spacing:.06em;color:var(--slate-bright)}
.album-note{font-size:14.5px;color:var(--slate);margin:4px 0 16px}
.grid{column-count:2;column-gap:12px}
@media (min-width:720px){.grid{column-count:3}}
.shot{position:relative;display:block;width:100%;margin-bottom:12px;break-inside:avoid;
  border-radius:4px;overflow:hidden;background:var(--bg-panel);padding:0;
  transition:transform .3s var(--ease)}
.shot img{width:100%;height:auto;transition:transform .5s var(--ease)}
.shot:hover{transform:translateY(-3px)}
.shot:hover img{transform:scale(1.04)}
.shot-cap{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;font-size:13px;
  color:#f4ebe5;background:linear-gradient(to top,rgba(8,3,4,.92),transparent);
  opacity:0;transition:opacity .3s var(--ease)}
.shot:hover .shot-cap,.shot:focus-visible .shot-cap{opacity:1}
.shot.empty{aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;
  border:1px dashed var(--line)}
.shot.empty img{display:none}
.shot.empty::after{content:attr(data-name);font-family:var(--font-mono);font-size:11px;
  letter-spacing:.1em;color:var(--slate);padding:0 12px;text-align:center}

.lightbox{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
  padding:24px;background:rgba(6,2,3,.95);backdrop-filter:blur(6px)}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:78vh;border-radius:3px;object-fit:contain}
.lb-inner{max-width:1000px;width:100%;text-align:center}
.lb-cap{margin-top:16px;font-size:14px;color:var(--slate-light)}
.lb-count{margin-top:4px;font-family:var(--font-mono);font-size:11.5px;
  letter-spacing:.12em;color:var(--slate)}
.lb-btn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;
  border-radius:50%;font-size:20px;color:var(--slate-bright);text-align:center;
  background:rgba(34,16,19,.85);transition:background-color .2s var(--ease)}
.lb-btn:hover{background:var(--accent);color:var(--char)}
.lb-prev{left:12px}.lb-next{right:12px}
.lb-close{position:absolute;top:16px;right:16px;transform:none;font-size:22px}




/* ============================================================
   全站搜索
   ============================================================ */
#find{position:fixed;inset:0;z-index:95;display:none;
  align-items:flex-start;justify-content:center;padding:12vh 20px 20px;
  background:rgba(253,252,250,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#find.on{display:flex}
.find-box{width:100%;max-width:620px}
.find-in{width:100%;padding:15px 18px;border-radius:6px;
  background:var(--bg-panel);border:1px solid var(--line);color:var(--slate-bright);
  font-family:var(--font-body);font-size:16.5px}
.find-in:focus{border-color:var(--accent);outline:none}
.find-hint{margin-top:var(--s1);font-family:var(--font-mono);font-size:10.5px;
  letter-spacing:.12em;color:var(--slate);opacity:.6}
.find-res{margin-top:var(--s2);max-height:56vh;overflow:auto}
.find-res a{display:flex;align-items:baseline;gap:11px;padding:11px 12px;border-radius:4px;
  transition:background-color .18s var(--ease)}
.find-res a:hover,.find-res a.sel{background:var(--bg-panel)}
.fr-sec{flex:none;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;
  color:var(--c-ink);background:var(--c-mid);padding:2px 8px;border-radius:2px}
.fr-t{flex:1;min-width:0;font-size:14.5px;color:var(--slate-bright);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr-d{flex:none;font-family:var(--font-mono);font-size:10.5px;color:var(--slate)}
.find-none{padding:var(--s3) 12px;font-size:14px;color:var(--slate)}

/* 标签索引 */
.tagbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:var(--s3)}
.tagbar a{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;
  color:var(--slate);border:1px solid var(--line);padding:3px 10px;border-radius:2px;
  transition:color .2s var(--ease),border-color .2s var(--ease)}
.tagbar a:hover{color:var(--accent);border-color:var(--accent)}
.tagbar a em{font-style:normal;opacity:.5;margin-left:5px}
.tag{cursor:pointer}
.tag:hover{border-color:var(--accent);color:var(--accent)}

/* ============================================================
   路线图
   ============================================================ */
.map-note{padding:16px 18px;border-left:3px solid var(--c-mid);background:var(--bg-panel);
  border-radius:0 4px 4px 0;font-size:14.5px;margin-bottom:12px}
.map-updated{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.12em;
  color:var(--slate);margin-bottom:20px}
.map-legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-bottom:16px;
  font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:var(--slate)}
.map-legend span{display:flex;align-items:center;gap:7px}
.map-legend i{width:16px;height:2px;display:block;background:var(--slate);opacity:.55}
.map-legend .l-here i{background:var(--accent);opacity:1;box-shadow:0 0 8px var(--accent)}
.map-legend .l-opt  i{background:var(--c-mid);opacity:1}
.map-legend .l-fut  i{background:var(--c-mid);opacity:.4}
.map-legend .l-drop i{background:var(--slate);opacity:.4}

.map-wrap{position:relative;overflow-x:auto;overflow-y:hidden;margin:0 -6px 6px;
  padding:6px;scrollbar-width:thin}
.map-wrap::-webkit-scrollbar{height:6px}
.map-wrap::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.map-canvas{position:relative}
.map-svg{position:absolute;inset:0;pointer-events:none;overflow:visible}

.mnode{position:absolute;height:84px;padding:24px 12px 10px;border-radius:5px;text-align:left;
  border:1px solid var(--line);background:var(--bg-panel);overflow:hidden;
  transition:border-color .2s var(--ease),transform .2s var(--ease),background-color .2s var(--ease)}
.mnode:hover{transform:translateY(-2px);border-color:var(--c-mid)}
.mnode .lb{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;font-size:13px;line-height:1.4;color:var(--slate-bright);font-weight:600}
.mnode .wh{display:block;margin-top:3px;font-family:var(--font-mono);font-size:10px;
  letter-spacing:.1em;color:var(--slate)}
.mnode .st{position:absolute;top:0;left:0;padding:2px 8px;border-radius:4px 0 4px 0;
  line-height:1.25;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;
  background:var(--bg);border:1px solid var(--line);color:var(--slate)}

.mnode.s-passed{opacity:.72}
.mnode.s-passed .lb{color:var(--slate-light);font-weight:500}
.mnode.s-here{border-color:var(--accent);background:rgba(23,20,15,.04);
  box-shadow:0 0 0 3px rgba(23,20,15,.06)}
.mnode.s-here .lb{color:var(--accent)}
.mnode.s-here .st{border-color:var(--accent);color:var(--char);background:var(--accent)}
.mnode.s-option{border-color:var(--c-mid)}
.mnode.s-option .st{border-color:var(--c-mid);color:var(--c-mid)}
.mnode.s-future{opacity:.62;border-style:dashed}
.mnode.s-dropped{opacity:.42;border-style:dashed}
.mnode.s-dropped .lb{text-decoration:line-through;text-decoration-color:rgba(162,144,138,.6)}
.mnode.on{border-color:var(--c-mid);background:var(--bg-raise)}
.mnode.dim{opacity:.22}

.map-detail{margin-top:20px;padding:18px 20px;border-radius:6px;
  background:var(--bg-panel);border:1px solid var(--line);display:none}
.map-detail.on{display:block;animation:openIn .3s var(--ease)}
.map-detail h4{font-family:var(--font-display);font-size:var(--t3);font-weight:700;
  letter-spacing:.04em;color:var(--slate-bright);line-height:1.4}
.map-detail .meta{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;
  color:var(--slate);margin:6px 0 14px}
.map-hint{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;
  color:var(--slate);opacity:.6;margin-top:10px}

/* ============================================================
   台账
   ============================================================ */
.led-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.led-search{flex:1;min-width:180px;padding:8px 12px;border-radius:4px;
  background:var(--bg-panel);border:1px solid var(--line);color:var(--slate-bright);
  font-family:var(--font-body);font-size:14px}
.led-search:focus{border-color:var(--c-mid);outline:none}
.led-count{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.12em;color:var(--slate)}
.led-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:22px}
.led-tag{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;
  color:var(--slate);border:1px solid var(--line);padding:2px 10px;border-radius:2px;
  cursor:pointer;transition:color .2s var(--ease),border-color .2s var(--ease)}
.led-tag:hover{color:var(--c-mid);border-color:var(--c-mid)}
.led-tag.on{color:var(--c-ink);background:var(--c-mid);border-color:var(--c-mid)}

.led-row{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:4px;
  border-bottom:1px solid var(--line);background:none;
  transition:background-color .2s var(--ease)}
.led-row:hover{background:var(--bg-panel)}
.led-head{display:flex;gap:12px;align-items:baseline}
.led-date{flex:none;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.08em;
  color:var(--slate);width:86px}
.led-key{flex:1;min-width:0;font-size:15px;color:var(--slate-bright);font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.led-mark{flex:none;font-family:var(--font-mono);font-size:12px;color:var(--slate);
  transition:transform .2s var(--ease)}
.led-row.open .led-mark{transform:rotate(90deg)}
.led-sum{margin:4px 0 0 98px;font-size:13.5px;color:var(--slate);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.led-row.open .led-sum{display:none}
.led-body{margin:14px 0 6px 98px;display:none}
.led-row.open .led-body{display:block}
.led-row .led-f,.led-row .led-lab,
.led-row .led-val,.led-row .led-sum{display:block}
.led-f{margin-bottom:16px}
.led-f:last-child{margin-bottom:0}
.led-lab{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.18em;
  color:var(--c-mid);margin-bottom:6px;opacity:.9}
.led-val{font-size:14.5px;line-height:1.85;color:var(--slate-light)}
.led-val .tag{display:inline-block}
.led-val p{margin-bottom:10px}
.led-val p:last-child{margin-bottom:0}
@media (max-width:640px){
  .led-date{width:auto}
  .led-sum,.led-body{margin-left:0}
}
.badge-private{display:inline-block;margin-left:10px;vertical-align:2px;
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;
  padding:2px 9px;border-radius:2px;border:1px solid var(--warn,#ffb86b);color:#ffb86b}

.foot{font-family:var(--font-mono);font-size:11.5px;line-height:2;color:var(--slate);
  margin-top:64px;padding-top:22px;border-top:1px solid var(--line);opacity:.7}
.empty-msg{font-size:14.5px;color:var(--slate);padding:20px 0}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

<!-- ========== 封面页 ========== -->

      <input id="pwIn" type="password" inputmode="numeric" autocomplete="off"
             placeholder="编辑口令" aria-label="编辑口令">

<main class="stage" id="stage" tabindex="-1"></main>

<script>
/* ============================================================
   口令设置 —— 想改密码，只改下面这两行
   ============================================================
   注意：这是"门牌"不是"锁"。它挡得住随手点进来的人，
   挡不住懂技术的人——他们可以直接访问 data.js 和 photos/
   里的文件，不经过这个页面。真正的保护方式见 README。
   ============================================================ */
var GATE_PASS = "1126";        // 访问口令：看内容需要
var EDIT_PASS = "20051126";    // 编辑口令：改内容需要

(function(){
"use strict";
var GK="rk_gate_v1", EK="rk_edit_v1";

/* ============================================================
   封面：每次打开网站都会先出现，这是固定行为。
   下面这行只决定「口令要不要重输」：
     "remember" 输过一次就记住，之后封面上只有一个「进入」  ← 现在是这个
     "session"  关掉浏览器再打开要重输
     "always"   每次刷新都要重输
   ============================================================ */
var GATE_MEMORY = "remember";

function gget(){
  try{
    if(GATE_MEMORY==="always")   return null;
    if(GATE_MEMORY==="remember") return localStorage.getItem(GK);
    return sessionStorage.getItem(GK);
  }catch(e){ return null; }
}
function gset(v){
  try{
    if(GATE_MEMORY==="always")   return;
    if(GATE_MEMORY==="remember") localStorage.setItem(GK,v);
    else sessionStorage.setItem(GK,v);
  }catch(e){}
}
function gdel(){
  try{ sessionStorage.removeItem(GK); localStorage.removeItem(GK); }catch(e){}
}
function get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function del(k){ try{ localStorage.removeItem(k); }catch(e){} }


/* 封面右上角的时钟 */
(function(){
  var box = document.getElementById("gateClock");
  if(!box) return;
  var W = ["日","一","二","三","四","五","六"];
  function pad(n){ return (n<10?"0":"")+n; }
  function tick(){
    var d = new Date();
    box.innerHTML = pad(d.getHours())+":"+pad(d.getMinutes())
      + '<span class="d">\u3000·\u3000' + (d.getMonth()+1) + " 月 " + d.getDate()
      + " 日 周" + W[d.getDay()] + "</span>";
  }
  tick(); setInterval(tick, 20000);
})();

var gate=document.getElementById("gate"),
    gIn =document.getElementById("gateIn"),
    gErr=document.getElementById("gateErr"),
    lock=document.getElementById("lock"),
    pw  =document.getElementById("pw"),
    pIn =document.getElementById("pwIn"),
    pErr=document.getElementById("pwErr");

function bad(box, msg){
  box.textContent = msg;
  box.parentNode.classList.add("shake");
  setTimeout(function(){ box.parentNode.classList.remove("shake"); }, 400);
}
var gGo   = document.getElementById("gateGo");
var gFoot = document.querySelector(".gate-foot");
var gMark = document.querySelector(".gate-mark");
var FOOT_DEFAULT = gFoot ? gFoot.textContent : "";
var MARK_DEFAULT = gMark ? gMark.textContent : "";

function unlocked(){ return gget()==="1"; }

/* 已经解锁过就不必再输口令，点一下直接进 */
function applyGateMode(){
  if(unlocked()){
    gIn.style.display = "none";
    gGo.textContent = "进入 →";
    if(gMark) gMark.textContent = "社会研究记录";
    if(gFoot) gFoot.textContent = "这台设备已经解锁过了，直接进入就好。";
  } else {
    gIn.style.display = "";
    gGo.textContent = "进入";
    if(gMark) gMark.textContent = MARK_DEFAULT;
    if(gFoot) gFoot.textContent = FOOT_DEFAULT;
  }
  gErr.textContent = "";
}

function openSite(){
  gate.classList.add("hide");
  /* 封面之后先进门厅，再由门厅进档案室 */
  if(window.__showHall){ setTimeout(window.__showHall, 20); }
  if(window.__gateBgStop) window.__gateBgStop();
  document.body.style.overflow="";
  document.documentElement.style.overflow="";
  lock.classList.remove("hide");
  if(get(EK)==="1") lock.classList.add("on");
}

/* 回到封面：不清除解锁状态，纯粹是想再看一眼 */
function showGate(){
  applyGateMode();
  gate.classList.remove("hide");
  document.body.style.overflow="hidden";
  document.documentElement.style.overflow="hidden";
  lock.classList.add("hide");
  if(window.__gateBgStart) window.__gateBgStart();
  /* 让入场动画重放一次 */
  var els = gate.querySelectorAll(".anim, .gate-name");
  Array.prototype.forEach.call(els, function(el){ el.style.animation = "none"; });
  void gate.offsetWidth;
  Array.prototype.forEach.call(els, function(el){ el.style.animation = ""; });
  if(!unlocked()) setTimeout(function(){ gIn.focus(); }, 420);
}
window.__showGate = showGate;

function tryGate(){
  if(unlocked()){ openSite(); return; }
  if(gIn.value.trim()===GATE_PASS){ gset("1"); gErr.textContent=""; openSite(); }
  else { bad(gErr,"口令不对，再试一次。"); gIn.value=""; gIn.focus(); }
}
gGo.addEventListener("click", tryGate);
gIn.addEventListener("keydown", function(e){ if(e.key==="Enter") tryGate(); });
gate.addEventListener("keydown", function(e){
  if(e.key==="Enter" && unlocked()) tryGate();
});

/* 每次打开都从封面开始；地址栏里若带着某个栏目，先清掉，
   保证顺序永远是 封面 → 门厅 → 桌面 */
if(location.hash && location.hash !== "#/" && location.hash !== "#"){
  history.replaceState(null, "", location.pathname + location.search);
}
applyGateMode();
document.body.style.overflow="hidden";
document.documentElement.style.overflow="hidden";
if(!unlocked()) setTimeout(function(){ gIn.focus(); }, 420);

function tryEdit(){
  if(pIn.value.trim()===EDIT_PASS){
    set(EK,"1"); pErr.textContent=""; pw.classList.remove("on");
    location.href="admin.html";
  } else { bad(pErr,"编辑口令不对。"); pIn.value=""; pIn.focus(); }
}
lock.addEventListener("click", function(){
  if(get(EK)==="1"){ location.href="admin.html"; return; }
  pw.classList.add("on"); pIn.value=""; pErr.textContent="";
  setTimeout(function(){ pIn.focus(); }, 100);
});
document.getElementById("pwGo").addEventListener("click", tryEdit);
pIn.addEventListener("keydown", function(e){ if(e.key==="Enter") tryEdit(); });
pw.addEventListener("click", function(e){ if(e.target===pw) pw.classList.remove("on"); });
document.addEventListener("keydown", function(e){ if(e.key==="Escape") pw.classList.remove("on"); });

document.addEventListener("click", function(e){
  var a = e.target.closest && e.target.closest("#relock");
  if(!a) return;
  e.preventDefault();
  if(!confirm("锁定这个网站？下次打开需要重新输入口令。")) return;
  gdel(); del(EK); location.reload();
});
})();
</script>

<!-- 私密台账：只存在你自己的电脑上，不要上传。文件不在时自动跳过 -->

<script>
(function(){
"use strict";

var $  = function(s,r){ return (r||document).querySelector(s); };
var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
function esc(s){ return String(s==null?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* 迷你 Markdown */
function inline(s){ return s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
                            .replace(/\*([^*]+)\*/g,"<em>$1</em>"); }
function md(src){
  if(!src) return "";
  return String(src).trim().split(/\n\s*\n/).map(function(b){
    b=b.trim();
    if(b.indexOf("## ")===0) return "<h3>"+inline(esc(b.slice(3)))+"</h3>";
    if(b.indexOf("> ")===0) return "<blockquote>"+inline(esc(b.replace(/^>\s?/gm,"")).replace(/\n/g,"<br>"))+"</blockquote>";
    if(/^[-*]\s/.test(b)) return "<ul>"+b.split("\n").map(function(l){
      return "<li>"+inline(esc(l.replace(/^[-*]\s+/,"")))+"</li>";}).join("")+"</ul>";
    var mImg = b.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
    if(mImg) return '<figure class="md-img"><img src="'+esc(mImg[2])+'" alt="'+esc(mImg[1])+'" loading="lazy">'
      + (mImg[1] ? '<figcaption>'+esc(mImg[1])+'</figcaption>' : '') + '</figure>';
    return "<p>"+inline(esc(b)).replace(/\n/g,"<br>")+"</p>";
  }).join("");
}
function fmtDate(d){
  var m = String(d||"").match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[1]+" 年 "+(+m[2])+" 月 "+(+m[3])+" 日" : (d||"");
}

/* ============================================================
   栏目全部来自 data.js 的 sections
   兼容老版 data.js（没有 sections 时按旧的五个栏目还原）
   ============================================================ */
var DEFAULTS = [
  {id:"about",name:"关于",sub:"我是谁，在做什么",type:"text",
   hi:"#9a6b3f",mid:"#c9945a",lo:"#7a5230",ink:"#2a1608"},
  {id:"works",name:"作品",sub:"做过的项目、研究和小东西",type:"list",
   hi:"#8f5f6a",mid:"#c07f8d",lo:"#6d4550",ink:"#2c121a"},
  {id:"notes",name:"随笔",sub:"没想清楚，但想记下来",type:"notes",
   hi:"#8d1620",mid:"#c22630",lo:"#680d15",ink:"#faeceb"},
  {id:"album",name:"回忆",sub:"生命里舍不得忘的时刻",type:"album",
   hi:"#3f6d68",mid:"#5b9089",lo:"#2c514d",ink:"#0f2320"},
  {id:"plan",name:"规划",sub:"暂时的版本，随时会改",type:"map",
   hi:"#9aad2a",mid:"#c8e026",lo:"#75851f",ink:"#1c2103"}
];
var FOLDERS = (SITE.sections && SITE.sections.length) ? SITE.sections.slice() : DEFAULTS.slice();
var STORE = SITE.store || {
  about:SITE.about, works:SITE.works, notes:SITE.notes,
  album:SITE.album, plan:SITE.plan
};
/* 本地存在 private.js 时把私密栏目并进来；线上没有这个文件，等于不存在 */
if(typeof PRIVATE !== "undefined" && PRIVATE){
  (PRIVATE.sections||[]).forEach(function(sec){
    sec.private = true;
    FOLDERS.push(sec);
  });
  var ps = PRIVATE.store || {};
  for(var k in ps){ if(Object.prototype.hasOwnProperty.call(ps,k)) STORE[k] = ps[k]; }
}
function contentOf(id){ return STORE[id]; }

function folderOf(id){
  for(var i=0;i<FOLDERS.length;i++) if(FOLDERS[i].id===id) return FOLDERS[i];
  return FOLDERS[0];
}
function fvars(f){
  /* 白色极简：不再用各栏目自己的颜色，统一黑白灰 */
  return "--c-hi:#cfcbc2;--c-mid:#17140f;--c-lo:#b7b2a7;--c-ink:#fdfcfa;";
}
function countOf(f){
  var d = contentOf(f.id);
  if(f.type==="list")  return ((d&&d.length)||0) + " 件";
  if(f.type==="notes") return ((d&&d.length)||0) + " 篇";
  if(f.type==="album"){
    var n=0; (d||[]).forEach(function(g){ n += ((g.photos||[]).length); });
    return n + " 张";
  }
  if(f.type==="ledger") return ((d&&d.length)||0) + " 笔";
  if(f.type==="map"){
    var q=((d&&d.nodes)||[]).filter(function(n){ return n.status==="option"; }).length;
    return q ? q+" 个岔口" : (((d&&d.nodes)||[]).length + " 站");
  }
  return "自述";
}



/* ============================================================
   门厅：填内容 + 进出
   ============================================================ */
function daysAgo(d){
  var m = String(d||"").match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return null;
  var then = new Date(+m[1], +m[2]-1, +m[3]);
  return Math.max(0, Math.round((Date.now()-then.getTime())/86400000));
}
function fillHall(){
  var sub = document.getElementById("hallSub");
  if(!sub) return;
  var handle = document.getElementById("hallHandle");
  if(handle) handle.textContent = SITE.handle;
  sub.textContent = SITE.lede || "";
  sub.style.display = SITE.lede ? "" : "none";

  /* 总账：开账多久、各类计数、最近多久没更新 */
  var items = allItems().filter(function(x){ return !x.sec.private; });
  var dated = items.filter(function(x){ return /^\d{4}-\d{2}-\d{2}/.test(x.date); })
                   .sort(function(a,b){ return a.date < b.date ? -1 : 1; });
  var counts = {};
  FOLDERS.forEach(function(f){
    if(f.private) return;
    var d = contentOf(f.id), n = 0;
    if(f.type==="notes"||f.type==="list"||f.type==="ledger") n = (d||[]).length;
    else if(f.type==="album") (d||[]).forEach(function(g){ n += (g.photos||[]).length; });
    if(n) counts[f.name] = n + (f.type==="ledger" ? " 笔"
                              : f.type==="notes" ? " 篇"
                              : f.type==="album" ? " 张" : " 件");
  });
  var parts = Object.keys(counts).map(function(k){
    return '<span style="white-space:nowrap">'+k+" <b>"+counts[k]+"</b></span>"; });
  var line1 = dated.length
    ? "开账 " + dated[0].date.replace(/-/g,".")
    : "还没开账";
  var last = dated.length ? daysAgo(dated[dated.length-1].date) : null;
  var line3 = last===null ? "" : (last===0 ? "今天刚记过一笔"
              : last===1 ? "昨天记过一笔" : "最近一次更新在 "+last+" 天前");
  var box = document.getElementById("hallTotals");
  if(box) box.innerHTML = line1 + "<br>" + parts.join("　·　") + (line3 ? "<br>"+line3 : "");

  /* 最近三条，直接点进去读 */
  var r = recentItems(3), rb = document.getElementById("hallRecent");
  if(rb){
    rb.innerHTML = r.length
      ? '<p class="lab">最近</p>' + r.map(function(x){
          return '<a href="'+x.href+'" data-hall-go style="'+fvars(x.sec)+'">'
            + '<span class="hd"></span><span class="ht">'+esc(x.title)+'</span>'
            + '<span class="hw">'+esc(x.date)+'</span></a>';
        }).join("")
      : '';
  }
}

function showHall(){
  var h = document.getElementById("hall");
  if(!h) return;
  fillHall();
  h.classList.add("on");
  h.setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden";
  document.documentElement.style.overflow="hidden";
  setTimeout(function(){ var g=document.getElementById("hallGo"); if(g) g.focus(); }, 120);
}
function hideHall(toDesk){
  var h = document.getElementById("hall");
  if(!h) return;
  h.classList.remove("on");
  h.setAttribute("aria-hidden","true");
  document.body.style.overflow="";
  document.documentElement.style.overflow="";
  /* 从门厅进来一律先落在桌面，保证 封面 → 门厅 → 桌面 的顺序 */
  if(toDesk !== false && location.hash && location.hash !== "#/"){
    location.hash = "#/";      /* 会触发 hashchange → render */
  } else {
    render();
  }
}
window.__showHall = showHall;

/* 门厅背景地图：鼠标位置驱动的手电筒光斑（触屏设备没有这个事件，天然退化成整体亮度） */
(function(){
  var hall = document.getElementById("hall");
  if(!hall) return;
  document.addEventListener("mousemove", function(e){
    if(!hall.classList.contains("on")) return;
    var r = hall.getBoundingClientRect();
    var mx = ((e.clientX - r.left) / r.width  * 100).toFixed(2) + "%";
    var my = ((e.clientY - r.top)  / r.height * 100).toFixed(2) + "%";
    hall.style.setProperty("--mx", mx);
    hall.style.setProperty("--my", my);
  });
})();

document.addEventListener("click", function(e){
  if(e.target.closest && e.target.closest("#hallGo")){ hideHall(true); return; }
  var link = e.target.closest && e.target.closest("[data-hall-go]");
  if(link){ setTimeout(function(){ hideHall(false); }, 0); return; }
  if(e.target.closest && e.target.closest("[data-hall]")){ e.preventDefault(); showHall(); }
});
document.addEventListener("keydown", function(e){
  var h = document.getElementById("hall");
  if(!h || !h.classList.contains("on")) return;
  if(e.key==="Escape" || e.key==="Enter") hideHall(true);
});

/* ============================================================
   全站索引：把各栏目的条目摊平成统一结构
   供「最近」、搜索、标签三处共用
   ============================================================ */
function allItems(){
  var out = [];
  FOLDERS.forEach(function(f){
    var d = contentOf(f.id);
    if(!d) return;
    if(f.type==="notes"){
      (d||[]).forEach(function(n){
        out.push({sec:f, title:n.title, date:n.date||"", tags:n.tags||[],
          text:(n.summary||"")+" "+(n.body||""),
          href:"#/"+encodeURIComponent(f.id)+"/"+encodeURIComponent(n.id)});
      });
    } else if(f.type==="list"){
      (d||[]).forEach(function(w){
        out.push({sec:f, title:w.title, date:w.date||"", tags:w.tags||[],
          text:(w.org||"")+" "+(w.desc||""),
          href:"#/"+encodeURIComponent(f.id)});
      });
    } else if(f.type==="ledger"){
      var fields = f.fields||[];
      (d||[]).forEach(function(r){
        var v=r.v||{}, tags=[];
        fields.forEach(function(x){
          if(x.kind==="tags") String(v[x.key]||"").split(/[，,、]/).forEach(function(t){
            t=t.trim(); if(t) tags.push(t); });
        });
        var keyF = fields.filter(function(x){ return x.kind==="line"; })[0] || fields[0];
        out.push({sec:f, title:(keyF? v[keyF.key] : "")||"（未命名）", date:r.date||"",
          tags:tags, text:fields.map(function(x){ return v[x.key]||""; }).join(" "),
          href:"#/"+encodeURIComponent(f.id)});
      });
    } else if(f.type==="map"){
      ((d&&d.nodes)||[]).forEach(function(n){
        out.push({sec:f, title:n.label, date:n.when||"", tags:[],
          text:n.note||"", href:"#/"+encodeURIComponent(f.id)});
      });
    } else if(f.type==="album"){
      (d||[]).forEach(function(g){
        out.push({sec:f, title:g.title, date:"", tags:[],
          text:(g.note||"")+" "+((g.photos||[]).map(function(x){return x.caption||"";}).join(" ")),
          href:"#/"+encodeURIComponent(f.id)});
      });
    } else if(f.type==="text"){
      out.push({sec:f, title:f.name, date:"", tags:[], text:String(d||""),
        href:"#/"+encodeURIComponent(f.id)});
    }
  });
  return out;
}
function recentItems(n){
  /* 只算有确切日期的内容：随笔和台账。路线图上的「以后」不是更新 */
  return allItems()
    .filter(function(x){
      return !x.sec.private && x.sec.type!=="map" && /^\d{4}-\d{2}/.test(x.date);
    })
    .sort(function(a,b){ return a.date < b.date ? 1 : -1; })
    .slice(0, n||3);
}
function allTags(){
  var m = {};
  allItems().forEach(function(x){
    (x.tags||[]).forEach(function(t){ m[t] = (m[t]||0)+1; });
  });
  return Object.keys(m).sort(function(a,b){ return m[b]-m[a]; })
    .map(function(t){ return {tag:t, n:m[t]}; });
}

/* ============================================================
   桌面
   ============================================================ */
var METHOD_WORDS = ["深度访谈","参与观察","漫游法","文本分析","问卷调查","个案追踪","口述整理","扎根编码"];

function viewDesk(){
  var tags = allTags().slice(0,6);
  var tagHref = tags.length ? "#/tag/"+encodeURIComponent(tags[0].tag) : "#/";
  var methods = METHOD_WORDS.concat(METHOD_WORDS);

  return ''
  + '<div class="bento">'

  +   '<div class="bento-head">'
  +     '<div class="bento-head-l">'
  +       '<p class="hud-mark">'+esc(SITE.handle)+'</p>'
  +       '<h1 class="bento-name">'+esc(SITE.name)+'</h1>'
  +       (SITE.thesis ? '<p class="bento-bio">'+esc(SITE.thesis)+'</p>' : '')
  +     '</div>'
  +     '<button class="bento-cta" id="openFind">搜索 /</button>'
  +   '</div>'

  +   '<div class="bento-grid">'

  +     '<div class="bento-col">'
  +       '<div class="bento-card bento-photo">'
  +         '<div class="bento-card-lab"><span class="spk">✦</span> 栏目 <span class="spk">✦</span></div>'
  +         '<div class="bento-jump">'
  +           FOLDERS.map(function(f){
                return '<a href="#/'+encodeURIComponent(f.id)+'">'
                  + '<span>'+esc(f.name)+'</span><b>'+esc(countOf(f))+'</b></a>';
              }).join("")
  +         '</div>'
  +       '</div>'
  +     '</div>'

  +     '<div class="bento-col">'
  +       '<a href="#/field" class="bento-card bento-field">'
  +         '<div class="bento-card-lab left">研究观察</div>'
  +         '<div class="bento-field-foot"><span class="hr-d">'+esc(countOf(folderOf("field")))+'</span>'
  +           '<span class="bento-arrow">↗</span></div>'
  +       '</a>'
  +     '</div>'

  +     '<div class="bento-col">'

function cardHTML(o, href, meta){

              ? ' href="'+esc(href)+'"'
              : ' href="'+esc(href)+'" target="_blank" rel="noopener"') : "";

    + '<div class="card-meta">'+esc(meta||"")+'</div>'
    + '<div><h3 class="card-title">'+esc(o.title)
    +   (href?' <span class="arrow">'+(href.indexOf("#")===0?'→':'↗')+'</span>':'')+'</h3>'

    + (o.desc?'<p class="card-desc">'+esc(o.desc)+'</p>':'')

        return '<span class="tag">'+esc(t)+'</span>'; }).join("")+'</div>':'')

function viewNotes(f){

function viewLedger(f){
  var rows = contentOf(f.id) || [];
  var fields = f.fields || [];
  if(!rows.length) return shell(f, emptyBox(f));

  /* 收集所有标签 */
  var tagKeys = fields.filter(function(x){ return x.kind==="tags"; }).map(function(x){ return x.key; });
  var all = {};
  rows.forEach(function(r){
    tagKeys.forEach(function(k){
      var v = (r.v||{})[k];
      String(v||"").split(/[，,、]/).forEach(function(t){
        t=t.trim(); if(t) all[t]=1;
      });
    });
  });
  var tags = Object.keys(all);

  var keyField = fields.filter(function(x){ return x.kind==="line"; })[0] || fields[0];
  var sumField = fields.filter(function(x){ return x.kind==="long"; })[0];

  var body = '<div class="led-bar">'
    + '<input class="led-search" id="ledQ" placeholder="搜索这本台账…" aria-label="搜索">'
    + '<span class="led-count" id="ledN">'+rows.length+' 笔</span></div>'
    + (tags.length ? '<div class="led-tags">'
        + tags.map(function(t){ return '<button class="led-tag" data-tag="'+esc(t)+'">'+esc(t)+'</button>'; }).join("")
        + '</div>' : '')
    + '<div id="ledList">' + rows.map(function(r, i){
        var v = r.v || {};
        var key = esc(v[keyField && keyField.key] || "（未命名）");
        var sum = sumField ? String(v[sumField.key]||"").replace(/\s+/g," ").slice(0,60) : "";
        var hay = (r.date||"") + " " + fields.map(function(x){ return v[x.key]||""; }).join(" ");
        return '<button class="led-row" data-i="'+i+'" data-hay="'+esc(hay)+'">'
          + '<span class="led-head"><span class="led-date">'+esc(r.date||"")+'</span>'
          +   '<span class="led-key">'+key+'</span><span class="led-mark">›</span></span>'
          + (sum ? '<span class="led-sum">'+esc(sum)+'</span>' : '')
          + '<span class="led-body">'
          +   fields.map(function(x){
                var val = v[x.key];
                if(!val) return '';
                var out;
                if(x.kind==="long")      out = md(val);
                else if(x.kind==="tags") out = String(val).split(/[，,、]/).map(function(t){
                    t=t.trim(); return t ? '<span class="tag" style="margin-right:6px">'+esc(t)+'</span>' : ''; }).join("");
                else                     out = esc(val);
                return '<span class="led-f"><span class="led-lab">'+esc(x.label)+'</span>'
                     + '<span class="led-val">'+out+'</span></span>';
              }).join("")
          + '</span></button>';
      }).join("") + '</div>';

  var sub = f.sub;
  if(f.private) sub = (sub||"") ;
  var html = shell(f, body, sub);
  if(f.private){
    html = html.replace('</h2>', '</h2><span class="badge-private">仅本机</span>');
  }
  return html;
}

/* 台账的展开、搜索、标签筛选 */
function wireLedger(){
  var list = document.getElementById("ledList");
  if(!list) return;
  var q = document.getElementById("ledQ");
  var n = document.getElementById("ledN");
  var active = null;

  list.addEventListener("click", function(e){
    var row = e.target.closest(".led-row");
    if(row) row.classList.toggle("open");
  });

  function apply(){
    var text = (q && q.value || "").trim().toLowerCase();
    var shown = 0;
    $$(".led-row", list).forEach(function(row){
      var hay = (row.getAttribute("data-hay")||"").toLowerCase();
      var okText = !text || hay.indexOf(text) >= 0;
      var okTag  = !active || hay.indexOf(active.toLowerCase()) >= 0;
      var show = okText && okTag;
      row.style.display = show ? "" : "none";
      if(show) shown++;
    });
    if(n) n.textContent = shown + " 笔";
  }
  if(q) q.addEventListener("input", apply);
  $$(".led-tag").forEach(function(b){
    b.addEventListener("click", function(){
      var t = b.getAttribute("data-tag");
      if(active === t){ active = null; b.classList.remove("on"); }
      else {
        active = t;
        $$(".led-tag").forEach(function(x){ x.classList.remove("on"); });
        b.classList.add("on");
      }
      apply();
    });
  });
}


function viewMap(f){
  var d = contentOf(f.id) || {};
  var nodes = d.nodes || [];
  if(!nodes.length) return shell(f, emptyBox(f));

  var LAB = {passed:"走过", here:"我在这里", option:"在考虑", future:"以后", dropped:"放弃了"};
  var byId = {}, kids = {};
  nodes.forEach(function(n){ byId[n.id]=n; kids[n.id]=[]; });
  var roots = [];
  nodes.forEach(function(n){
    if(n.parent && byId[n.parent]) kids[n.parent].push(n);
    else roots.push(n);
  });

  /* 布局：叶子依次占列，父节点居中于子节点之上 */
  var NW=168, NH=84, GAPX=22, ROW=136, pos={}, slot=0;
  function place(n, depth){
    var ch = kids[n.id];
    if(!ch.length){ pos[n.id]={x:slot*(NW+GAPX), y:depth*ROW}; slot++; return pos[n.id].x; }
    var xs = ch.map(function(c){ return place(c, depth+1); });
    var x = (xs[0]+xs[xs.length-1])/2;
    pos[n.id]={x:x, y:depth*ROW};
    return x;
  }
  roots.forEach(function(r){ place(r,0); });

  var maxX=0, maxY=0;
  nodes.forEach(function(n){
    if(!pos[n.id]) return;
    maxX = Math.max(maxX, pos[n.id].x + NW);
    maxY = Math.max(maxY, pos[n.id].y);
  });
  var H = maxY + NH + 12;

  /* 连线 */
  var paths = nodes.map(function(n){
    if(!n.parent || !byId[n.parent] || !pos[n.id] || !pos[n.parent]) return "";
    var a=pos[n.parent], b=pos[n.id];
    var x1=a.x+NW/2, y1=a.y+NH, x2=b.x+NW/2, y2=b.y;
    var my=(y1+y2)/2;
    var st = n.status || "future";
    var stroke = st==="here" ? "var(--accent)"
               : st==="option" ? "var(--c-mid)"
               : st==="passed" ? "var(--slate)" : "var(--c-mid)";
    var op = st==="passed" ? ".5" : st==="dropped" ? ".22"
           : st==="future" ? ".32" : ".85";
    var dash = (st==="future"||st==="dropped") ? ' stroke-dasharray="4 5"' : '';
    return '<path d="M'+x1+' '+y1+' C'+x1+' '+my+' '+x2+' '+my+' '+x2+' '+y2+'" '
      + 'fill="none" stroke="'+stroke+'" stroke-width="1.6" opacity="'+op+'"'+dash
      + ' data-edge="'+esc(n.id)+'"></path>';
  }).join("");

  var cards = nodes.map(function(n){
    if(!pos[n.id]) return "";
    var st = n.status || "future";
    return '<button class="mnode s-'+st+'" data-node="'+esc(n.id)+'" '
      + 'style="left:'+pos[n.id].x+'px;top:'+pos[n.id].y+'px;width:'+NW+'px">'
      + '<span class="st">'+esc(LAB[st]||st)+'</span>'
      + '<span class="lb">'+esc(n.label)+'</span>'
      + (n.when?'<span class="wh">'+esc(n.when)+'</span>':'')
      + '</button>';
  }).join("");

  var body = "";
  if(d.note)    body += '<div class="map-note prose">'+md(d.note)+'</div>';
  if(d.updated) body += '<p class="map-updated">最后更新 · '+esc(d.updated)+'</p>';
  body += '<div class="map-legend">'
    + '<span class="l-here"><i></i>我在这里</span>'
    + '<span class="l-opt"><i></i>在考虑</span>'
    + '<span class="l-fut"><i></i>以后</span>'
    + '<span class="l-drop"><i></i>放弃了</span></div>'
    + '<div class="map-wrap"><div class="map-canvas" id="mapCanvas" '
    +   'style="width:'+(maxX+8)+'px;height:'+H+'px">'
    +   '<svg class="map-svg" width="'+(maxX+8)+'" height="'+H+'">'+paths+'</svg>'
    +   cards + '</div></div>'
    + '<p class="map-hint">点节点看当时怎么想的 · 图放不下可以左右拖</p>'
    + '<div class="map-detail" id="mapDetail"></div>';

  /* 详情数据挂到全局，供交互取用 */
  MAPDATA = {nodes:byId, labels:LAB};
  return shell(f, body);
}

var MAPDATA = null;
function wireMap(){
  var canvas = document.getElementById("mapCanvas");
  if(!canvas || !MAPDATA) return;
  var box = document.getElementById("mapDetail");
  var cur = null;

  /* 图比屏幕宽的时候，默认把「我在这里」卷入可见范围，
     而不是永远停在最左边（否则窄屏一打开根本看不到当前位置） */
  var wrap = document.getElementById("mapCanvas").parentNode;
  var here = canvas.querySelector(".mnode.s-here");
  if(wrap && here && wrap.scrollWidth > wrap.clientWidth){
    var target = here.offsetLeft + here.offsetWidth/2 - wrap.clientWidth/2;
    wrap.scrollLeft = Math.max(0, Math.min(target, wrap.scrollWidth - wrap.clientWidth));
  }

  canvas.addEventListener("click", function(e){
    var btn = e.target.closest(".mnode");
    if(!btn) return;
    var id = btn.getAttribute("data-node");
    if(cur === id){
      cur = null; box.classList.remove("on");
      $$(".mnode").forEach(function(x){ x.classList.remove("on","dim"); });
      return;
    }
    cur = id;
    var n = MAPDATA.nodes[id];

    /* 高亮从起点到这个节点的整条路径 */
    var chain = {}, p = n;
    while(p){ chain[p.id]=1; p = p.parent ? MAPDATA.nodes[p.parent] : null; }
    $$(".mnode").forEach(function(x){
      var xid = x.getAttribute("data-node");
      x.classList.toggle("on", xid===id);
      x.classList.toggle("dim", !chain[xid]);
    });

    box.innerHTML = '<h4>'+esc(n.label)+'</h4>'
      + '<p class="meta">'+esc(MAPDATA.labels[n.status]||"")
      + (n.when?'　·　'+esc(n.when):'')+'</p>'
      + '<div class="prose">'+md(n.note||"（还没写想法）")+'</div>';
    box.classList.add("on");
  });
}


/* ============================================================
   全站搜索
   ============================================================ */
(function(){
  var box=document.getElementById("find"),
      inp=document.getElementById("findIn"),
      res=document.getElementById("findRes"),
      sel=0, hits=[];

  function open(){
    box.classList.add("on"); inp.value=""; draw("");
    setTimeout(function(){ inp.focus(); }, 60);
  }
  function close(){ box.classList.remove("on"); }

  function draw(q){
    q = q.trim().toLowerCase();
    var items = allItems();
    hits = !q ? items.slice(0,8) : items.filter(function(x){
      return ((x.title||"")+" "+(x.text||"")+" "+(x.tags||[]).join(" "))
        .toLowerCase().indexOf(q) >= 0;
    }).slice(0,20);
    sel = 0;
    if(!hits.length){ res.innerHTML='<p class="find-none">没有找到。</p>'; return; }
    res.innerHTML = hits.map(function(x,i){
      return '<a href="'+x.href+'" data-i="'+i+'" class="'+(i===0?"sel":"")+'" '
        + 'style="'+fvars(x.sec)+'">'
        + '<span class="fr-sec">'+esc(x.sec.name)+'</span>'
        + '<span class="fr-t">'+esc(x.title)+'</span>'
        + '<span class="fr-d">'+esc(x.date||"")+'</span></a>';
    }).join("");
  }
  function move(d){
    var links = $$("a", res);
    if(!links.length) return;
    links[sel] && links[sel].classList.remove("sel");
    sel = (sel + d + links.length) % links.length;
    links[sel].classList.add("sel");
    links[sel].scrollIntoView({block:"nearest"});
  }

  inp.addEventListener("input", function(){ draw(this.value); });
  document.addEventListener("keydown", function(e){
    var typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
    var unlocked = document.getElementById("gate").classList.contains("hide");
    if(e.key === "/" && !typing && unlocked){ e.preventDefault(); open(); return; }
    if(!box.classList.contains("on")) return;
    if(e.key === "Escape"){ close(); }
    if(e.key === "ArrowDown"){ e.preventDefault(); move(1); }
    if(e.key === "ArrowUp"){ e.preventDefault(); move(-1); }
    if(e.key === "Enter"){
      var links = $$("a", res);
      if(links[sel]){ location.hash = links[sel].getAttribute("href").slice(1); close(); }
    }
  });
  box.addEventListener("click", function(e){
    if(e.target === box) close();
    var a = e.target.closest && e.target.closest("a");
    if(a) close();
  });
  document.addEventListener("click", function(e){
    if(e.target.closest && e.target.closest("#openFind")) open();
  });
})();

function viewTag(name){
  var hits = allItems().filter(function(x){
    return (x.tags||[]).some(function(t){ return t===name; });
  });
  var f = {id:"tag", name:"标签 · "+name, sub:hits.length+" 条相关内容",
           type:"tag", hi:"#5a5f6a", mid:"#8a90a0", lo:"#43475c", ink:"#0f1116"};
  var body = '<div class="tagbar">'
    + allTags().map(function(t){
        return '<a href="#/tag/'+encodeURIComponent(t.tag)+'"'
          + (t.tag===name?' style="color:var(--accent);border-color:var(--accent)"':'')
          + '>'+esc(t.tag)+'<em>'+t.n+'</em></a>';
      }).join("") + '</div>';
  body += hits.length ? '<div class="cards">' + hits.map(function(x){
      return '<a class="card" href="'+x.href+'" style="'+fvars(x.sec)+'">'
        + '<div class="card-meta">'+esc(x.date||"")+'</div>'
        + '<div><h3 class="card-title">'+esc(x.title)+' <span class="arrow">→</span></h3>'
        + '<p class="card-org">'+esc(x.sec.name)+'</p></div>'
        + '<p class="card-desc">'+esc(String(x.text||"").replace(/\s+/g," ").slice(0,80))+'</p>'
        + '</a>';
    }).join("") + '</div>'
    : '<p class="empty-msg">没有用过这个标签。</p>';
  return shell(f, body);
}

function viewSection(f, sub){
  if(f.type==="text")  return viewText(f);
  if(f.type==="list")  return viewList(f);
  if(f.type==="notes") return sub ? viewNote(f, sub) : viewNotes(f);
  if(f.type==="album") return viewAlbum(f);
  if(f.type==="ledger") return viewLedger(f);
  if(f.type==="map")    return viewMap(f);
  return shell(f, emptyBox(f));
}

/* ============================================================
   路由
   ============================================================ */
function render(){
  var raw = location.hash.replace(/^#\/?/,"");
  var parts = raw.split("/");
  var page = parts[0] ? decodeURIComponent(parts[0]) : "";
  var html, found = null;

  if(page){
    for(var i=0;i<FOLDERS.length;i++) if(FOLDERS[i].id===page) found = FOLDERS[i];
  }
  if(page==="tag" && parts[1]){ html = viewTag(decodeURIComponent(parts[1])); found = true; }
  else if(found) html = viewSection(found, parts[1] ? decodeURIComponent(parts[1]) : null);
  else html = viewDesk();

  $("#stage").innerHTML = html;
  document.title = SITE.name + " · " + SITE.handle;
  var gn=document.getElementById("gateName"), gh=document.getElementById("gateHandle");
  if(gn) gn.textContent = SITE.name;
  if(gh) gh.textContent = SITE.handle;
  markBroken();
  wireLedger();
  wireMap();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", render);

function markBroken(){
  $$(".shot img").forEach(function(img){
    var mark=function(){ img.parentNode.classList.add("empty"); };
    if(img.complete && img.naturalWidth===0) mark();
    img.addEventListener("error", mark);
  });
}

/* 灯箱 */
var lb=$("#lb"), lbImg=$("#lbImg"), lbCap=$("#lbCap"), lbCount=$("#lbCount"), cur=0, lastFocus=null;
function openLb(i){
  if(!FLAT.length) return;
  cur=(i+FLAT.length)%FLAT.length;
  var p=FLAT[cur];
  lbImg.src=p.src||""; lbImg.alt=p.caption||"";
  lbCap.textContent=p.caption||"";
  lbCount.textContent=(cur+1)+" / "+FLAT.length;
  lb.classList.add("open");
  document.body.style.overflow="hidden";
  $("#lbClose").focus();
}
function closeLb(){
  lb.classList.remove("open"); document.body.style.overflow="";
  if(lastFocus) lastFocus.focus();
}
document.addEventListener("click", function(e){
  var shot = e.target.closest && e.target.closest(".shot");
  if(shot && !shot.classList.contains("empty")){
    lastFocus=shot; openLb(+shot.getAttribute("data-i")); return;
  }
  if(e.target===lb) closeLb();
});
$("#lbClose").onclick=closeLb;
$("#lbPrev").onclick=function(){ openLb(cur-1); };
$("#lbNext").onclick=function(){ openLb(cur+1); };
document.addEventListener("keydown", function(e){
  if(!lb.classList.contains("open")) return;
  if(e.key==="Escape") closeLb();
  if(e.key==="ArrowLeft") openLb(cur-1);
  if(e.key==="ArrowRight") openLb(cur+1);
});

render();
})();
</script>
